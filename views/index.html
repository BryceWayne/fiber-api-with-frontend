<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
    <main>
        <h1>{{.Title}}</h1>
        <p>{{.Message}}</p>
        
        <div class="api-demo">
            <h2>API Endpoint Demo</h2>
            <button 
                hx-get="/api/hello-html" 
                hx-target="#apiResponse"
                hx-swap="innerHTML">
                Fetch from API
            </button>
            <div id="apiResponse"></div>
        </div>
    </main>
</body>
</html>
